name: Publish validated Reel preview

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - reel-materializer-run.txt
      - .github/workflows/publish-reel-main.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out validated media branch
        uses: actions/checkout@v4
        with:
          ref: generated-reel-assets
          path: generated

      - name: Check out public main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Publish the pinned acceptance surface
        run: |
          set -euo pipefail
          rm -rf main/published
          mkdir -p main/published
          cp -R generated/assets main/published/assets
          cp generated/preview.html main/published/preview.html
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published
          if git diff --cached --quiet; then
            echo "Published preview is already current."
            exit 0
          fi
          git commit -m "assets: publish validated Reel acceptance preview"
          git push origin HEAD:main
