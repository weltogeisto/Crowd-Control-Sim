name: Smoke Reel synchronization

on:
  push:
    branches: [main]
    paths:
      - published/preview.html
      - published/assets/leuchtfeuer-hype-reel.mp4
      - published/assets/manifest.json
      - .github/workflows/smoke-reel-sync.yml
  pull_request:
    branches: [main]
    paths:
      - published/preview.html
      - published/assets/leuchtfeuer-hype-reel.mp4
      - published/assets/manifest.json
      - .github/workflows/smoke-reel-sync.yml
      - reel-sync-smoke-run.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify embedded H.264 and AAC tracks
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 <<'PY'
          import json
          import subprocess

          path = "published/assets/leuchtfeuer-hype-reel.mp4"
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-print_format", "json",
              "-show_streams", "-show_format", path,
          ]))
          videos = [stream for stream in probe["streams"] if stream.get("codec_type") == "video"]
          audios = [stream for stream in probe["streams"] if stream.get("codec_type") == "audio"]
          assert len(videos) == 1, videos
          assert len(audios) == 1, audios
          assert videos[0]["codec_name"] == "h264", videos[0]
          assert videos[0]["pix_fmt"] == "yuv420p", videos[0]
          assert audios[0]["codec_name"] == "aac", audios[0]
          video_duration = float(videos[0]["duration"])
          audio_duration = float(audios[0]["duration"])
          assert abs(video_duration - audio_duration) < 0.005, (video_duration, audio_duration)
          print(f"single AV container: H.264 + AAC, duration={video_duration:.3f}s")
          PY

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Verify first and second synchronized playback
        run: |
          python3 -m http.server 4173 --directory published >/tmp/reel-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');

          async function verifyRun(page, label, previousSrc = null) {
            await page.click('#launch');
            await page.waitForFunction(() => {
              const video = document.querySelector('#video');
              return video && !video.paused && !video.muted && video.volume > 0 && video.currentTime > 0.5;
            }, { timeout: 15_000 });

            const start = await page.evaluate(() => {
              const video = document.querySelector('#video');
              return {
                src: video.currentSrc,
                currentTime: video.currentTime,
                readyState: video.readyState,
                width: video.videoWidth,
                height: video.videoHeight,
                muted: video.muted,
                volume: video.volume,
                error: video.error ? video.error.code : null,
                audioElements: document.querySelectorAll('audio').length,
              };
            });

            if (start.readyState < 3) throw new Error(`${label}: readyState ${start.readyState}`);
            if (start.width !== 1280 || start.height !== 720) {
              throw new Error(`${label}: dimensions ${start.width}x${start.height}`);
            }
            if (start.muted || start.volume <= 0) throw new Error(`${label}: video is not audible`);
            if (start.error !== null) throw new Error(`${label}: media error ${start.error}`);
            if (start.audioElements !== 0) throw new Error(`${label}: separate audio element still exists`);
            if (previousSrc && start.src === previousSrc) throw new Error(`${label}: player source was not remounted`);

            await page.waitForTimeout(1800);
            const advanced = await page.evaluate(() => document.querySelector('#video').currentTime);
            if (advanced <= start.currentTime + 1) {
              throw new Error(`${label}: timeline did not advance (${start.currentTime} -> ${advanced})`);
            }
            console.log(`${label}: audible single-player timeline ${start.currentTime.toFixed(3)} -> ${advanced.toFixed(3)}`);
            return start.src;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 412, height: 915 },
              userAgent: 'Mozilla/5.0 (Linux; Android 16; Pixel 9) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36',
              isMobile: true,
              hasTouch: true,
            });
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/preview.html', { waitUntil: 'networkidle' });

            const firstSrc = await verifyRun(page, 'first start');
            await page.click('#close');
            await page.waitForTimeout(300);
            await verifyRun(page, 'second start', firstSrc);

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
