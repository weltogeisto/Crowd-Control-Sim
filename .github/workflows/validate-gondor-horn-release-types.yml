name: Validate Gondor Horn release types

on:
  pull_request:
    branches: [main]
    paths:
      - gondor-horn-typecheck-trigger.txt
      - .github/workflows/validate-gondor-horn-release-types.yml

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TypeScript
        run: npm install --no-save typescript
      - name: Compile release-layer export override
        shell: bash
        run: |
          mkdir -p /tmp/gondor-release
          cat > /tmp/gondor-release/hornOmens.ts <<'EOF'
          export type HornSpecialStinger = {
            id: "hoppy-di-hopp" | "mumakil" | "old-card";
            title: string;
            src: string;
            posterSrc: string;
            audioSrc: string;
            alt: string;
            eyebrow: string;
            subtitle: string;
            caption: string;
            gain?: number;
            durationMs?: number;
            delayMs?: number;
            theme?: "argonath";
          };
          export type HornMilestone = { kind: "vision" | "none" };
          export type HornHeroSound = { id: string };
          export const HOPPY_DI_HOPP_STINGER = { id: "hoppy-di-hopp" } as unknown as HornSpecialStinger;
          export const MUMAKIL_HORN_STINGER = { id: "mumakil" } as unknown as HornSpecialStinger;
          export const ACTIVE_FEATURED_HORN_STINGER = HOPPY_DI_HOPP_STINGER;
          export const MIDDLE_EARTH_HORN_RESPONSE_DECK = [{ id: "old-card" }] as unknown as readonly HornSpecialStinger[];
          export function getActiveFeaturedHornStinger(id: unknown) { return id === "hoppy-di-hopp" ? HOPPY_DI_HOPP_STINGER : null; }
          export function getShuffledMiddleEarthHornResponseDeck(_block: number) { return [...MIDDLE_EARTH_HORN_RESPONSE_DECK]; }
          export function isMiddleEarthHornResponseCount(count: number) { return count === 4 || count === 11; }
          export function getMiddleEarthHornResponse(_count?: number) { return MIDDLE_EARTH_HORN_RESPONSE_DECK[0] ?? null; }
          export function getHornSpecialStinger(count: number) { return count === 15 ? MUMAKIL_HORN_STINGER : getMiddleEarthHornResponse(count); }
          export function getHornMilestone(_count: number): HornMilestone { return { kind: "none" }; }
          export function getHornHeroSound(_count: number): HornHeroSound | null { return { id: "hero" }; }
          export function getHornResponseSelection(count: number) { return { milestone: getHornMilestone(count), specialStinger: null, heroSound: getHornHeroSound(count) }; }
          EOF
          cat > /tmp/gondor-release/hornOmensRelease.ts <<'EOF'
          import * as base from "./hornOmens";
          export * from "./hornOmens";
          export const GONDOR_RALLY_STINGER = {
            id: "gondor-rally",
            title: "Gondor ruft zu den Waffen",
            src: "/rally.mp4",
            posterSrc: "/rally.webp",
            audioSrc: "/rally.mp3",
            alt: "rally",
            eyebrow: "Vor der Weißen Stadt",
            subtitle: "Ein Krieger richtet sich an das versammelte Heer.",
            caption: "caption",
            gain: 0,
            durationMs: 26_250,
            delayMs: 0,
            theme: "argonath",
          } as unknown as base.HornSpecialStinger;
          export const ACTIVE_FEATURED_HORN_STINGER: base.HornSpecialStinger = GONDOR_RALLY_STINGER;
          export function getActiveFeaturedHornStinger(id: unknown): base.HornSpecialStinger | null {
            if (id === GONDOR_RALLY_STINGER.id) return GONDOR_RALLY_STINGER;
            return base.getActiveFeaturedHornStinger(id);
          }
          export const MIDDLE_EARTH_HORN_RESPONSE_DECK = [
            ...base.MIDDLE_EARTH_HORN_RESPONSE_DECK,
            GONDOR_RALLY_STINGER,
          ] as const satisfies readonly base.HornSpecialStinger[];
          export function getShuffledMiddleEarthHornResponseDeck(block: number): readonly base.HornSpecialStinger[] {
            const previousSequence = [...base.getShuffledMiddleEarthHornResponseDeck(block)];
            previousSequence.splice(Math.floor(previousSequence.length / 2), 0, GONDOR_RALLY_STINGER);
            return previousSequence;
          }
          export function getMiddleEarthHornResponse(count: number): base.HornSpecialStinger | null {
            if (!base.isMiddleEarthHornResponseCount(count)) return null;
            let responseNumber = 0;
            for (let candidate = 1; candidate <= count; candidate += 1) {
              if (base.isMiddleEarthHornResponseCount(candidate)) responseNumber += 1;
            }
            const block = Math.floor((responseNumber - 1) / MIDDLE_EARTH_HORN_RESPONSE_DECK.length);
            const index = (responseNumber - 1) % MIDDLE_EARTH_HORN_RESPONSE_DECK.length;
            return getShuffledMiddleEarthHornResponseDeck(block)[index] ?? null;
          }
          export function getHornSpecialStinger(count: number): base.HornSpecialStinger | null {
            if (base.isMiddleEarthHornResponseCount(count)) return getMiddleEarthHornResponse(count);
            return base.getHornSpecialStinger(count);
          }
          export type HornResponseSelection = {
            milestone?: base.HornMilestone;
            specialStinger: base.HornSpecialStinger | null;
            heroSound: base.HornHeroSound | null;
          };
          export function getHornResponseSelection(count: number | undefined, featuredStingerId?: unknown): HornResponseSelection {
            const milestone = typeof count === "number" ? base.getHornMilestone(count) : undefined;
            const featuredStinger = getActiveFeaturedHornStinger(featuredStingerId);
            const specialStinger = featuredStinger ?? (typeof count === "number" ? getHornSpecialStinger(count) : null);
            const heroSound = specialStinger ? null : typeof count === "number" ? base.getHornHeroSound(count) : null;
            return { milestone, specialStinger, heroSound };
          }
          EOF
          cat > /tmp/gondor-release/index.ts <<'EOF'
          import {
            ACTIVE_FEATURED_HORN_STINGER,
            GONDOR_RALLY_STINGER,
            MIDDLE_EARTH_HORN_RESPONSE_DECK,
            getHornResponseSelection,
          } from "./hornOmensRelease";
          const active: string = String(ACTIVE_FEATURED_HORN_STINGER.id);
          if (active !== "gondor-rally") throw new Error(active);
          if (MIDDLE_EARTH_HORN_RESPONSE_DECK.length !== 2) throw new Error("deck");
          if (getHornResponseSelection(15, "gondor-rally").specialStinger !== GONDOR_RALLY_STINGER) throw new Error("feature");
          EOF
          cat > /tmp/gondor-release/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "strict": true,
              "noEmit": true,
              "module": "esnext",
              "moduleResolution": "bundler",
              "target": "es2022"
            },
            "include": ["*.ts"]
          }
          EOF
          ./node_modules/.bin/tsc -p /tmp/gondor-release/tsconfig.json
