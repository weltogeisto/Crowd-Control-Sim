name: Build second Horn preview

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-second-horn-preview.yml
      - second-horn-preview-trigger.txt

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/second-horn-preview-build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          npm install --no-save playwright@1.61.1
          python -m pip install --upgrade pip
          python -m pip install 'yt-dlp[curl-cffi]>=2026.7.23' faster-whisper
          google-chrome --version
          yt-dlp --version

      - name: Establish a real Chrome session and capture signed media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf second-horn-work published/second-horn
          mkdir -p second-horn-work/profile published/second-horn

          cat > second-horn-work/browser-session.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const { URL } = require('url');

          const VIDEO_ID = 'xjItqTkLaU4';
          const work = 'second-horn-work';
          const responses = [];
          const consoleLines = [];

          function withoutRange(raw) {
            try {
              const url = new URL(raw);
              url.searchParams.delete('range');
              return url.toString();
            } catch {
              return raw;
            }
          }

          function toNetscape(cookies) {
            const header = '# Netscape HTTP Cookie File\n# Generated by Playwright for this one-time media build\n';
            return header + cookies.map(cookie => {
              const domain = cookie.domain.startsWith('.') ? cookie.domain : `.${cookie.domain}`;
              const includeSubdomains = domain.startsWith('.') ? 'TRUE' : 'FALSE';
              const secure = cookie.secure ? 'TRUE' : 'FALSE';
              const expires = cookie.expires > 0 ? Math.floor(cookie.expires) : 0;
              return [domain, includeSubdomains, cookie.path || '/', secure, expires, cookie.name, cookie.value].join('\t');
            }).join('\n') + '\n';
          }

          (async () => {
            const context = await chromium.launchPersistentContext(`${work}/profile`, {
              channel: 'chrome',
              headless: false,
              viewport: { width: 1365, height: 900 },
              locale: 'en-US',
              timezoneId: 'Europe/Berlin',
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36',
              args: [
                '--autoplay-policy=no-user-gesture-required',
                '--disable-blink-features=AutomationControlled',
                '--disable-features=PreloadMediaEngagementData,MediaEngagementBypassAutoplayPolicies',
                '--no-first-run',
                '--no-default-browser-check',
              ],
            });
            const pages = context.pages();
            const page = pages[0] || await context.newPage();

            page.on('console', message => consoleLines.push(`${message.type()}: ${message.text()}`));
            page.on('response', async response => {
              const raw = response.url();
              if (!raw.includes('googlevideo.com/videoplayback')) return;
              const headers = await response.allHeaders().catch(() => ({}));
              responses.push({
                url: raw,
                cleanUrl: withoutRange(raw),
                status: response.status(),
                contentType: headers['content-type'] || '',
                contentLength: headers['content-length'] || '',
                requestHeaders: await response.request().allHeaders().catch(() => ({})),
              });
            });

            await page.goto(`https://www.youtube.com/watch?v=${VIDEO_ID}&hl=en`, {
              waitUntil: 'domcontentloaded',
              timeout: 90_000,
            });
            await page.waitForTimeout(3_000);

            const consentPatterns = [
              /Accept all/i,
              /Reject all/i,
              /I agree/i,
              /Agree/i,
              /Accept/i,
            ];
            for (const pattern of consentPatterns) {
              const candidates = [
                page.getByRole('button', { name: pattern }),
                page.getByRole('button', { name: pattern, exact: false }),
              ];
              for (const candidate of candidates) {
                if (await candidate.count()) {
                  await candidate.first().click({ force: true }).catch(() => undefined);
                  await page.waitForTimeout(1_500);
                  break;
                }
              }
            }

            const playSelectors = [
              '.ytp-large-play-button',
              '.ytp-play-button',
              'button[aria-label*="Play"]',
            ];
            for (const selector of playSelectors) {
              const button = page.locator(selector);
              if (await button.count()) {
                await button.first().click({ force: true }).catch(() => undefined);
                await page.waitForTimeout(1_000);
              }
            }
            await page.keyboard.press('k').catch(() => undefined);
            await page.waitForTimeout(18_000);

            const state = await page.evaluate(() => {
              const video = document.querySelector('video');
              const initial = globalThis.ytInitialPlayerResponse || globalThis.ytplayer?.config?.args?.player_response || null;
              let playerResponse = initial;
              if (typeof playerResponse === 'string') {
                try { playerResponse = JSON.parse(playerResponse); } catch { playerResponse = null; }
              }
              return {
                href: location.href,
                title: document.title,
                bodyText: document.body?.innerText?.slice(0, 8000) || '',
                video: video ? {
                  currentTime: video.currentTime,
                  duration: video.duration,
                  paused: video.paused,
                  readyState: video.readyState,
                  width: video.videoWidth,
                  height: video.videoHeight,
                  error: video.error ? { code: video.error.code, message: video.error.message } : null,
                } : null,
                playerResponse,
              };
            }).catch(error => ({ evaluationError: String(error) }));

            await page.screenshot({ path: `${work}/watch-page.png`, fullPage: true });
            const cookies = await context.cookies();
            fs.writeFileSync(`${work}/cookies.json`, JSON.stringify(cookies, null, 2));
            fs.writeFileSync(`${work}/cookies.txt`, toNetscape(cookies));
            fs.writeFileSync(`${work}/browser-state.json`, JSON.stringify({ ...state, playerResponse: state.playerResponse ? '[stored separately]' : null }, null, 2));
            fs.writeFileSync(`${work}/player-response.json`, JSON.stringify(state.playerResponse || {}, null, 2));
            fs.writeFileSync(`${work}/media-responses.json`, JSON.stringify(responses, null, 2));
            fs.writeFileSync(`${work}/console.txt`, consoleLines.join('\n'));

            const formats = [];
            const streamingData = state.playerResponse?.streamingData;
            for (const item of [...(streamingData?.formats || []), ...(streamingData?.adaptiveFormats || [])]) {
              if (!item.url) continue;
              formats.push({
                url: withoutRange(item.url),
                itag: item.itag,
                mimeType: item.mimeType,
                bitrate: item.bitrate,
                width: item.width,
                height: item.height,
                qualityLabel: item.qualityLabel,
                audioQuality: item.audioQuality,
                contentLength: item.contentLength,
              });
            }
            fs.writeFileSync(`${work}/player-formats.json`, JSON.stringify(formats, null, 2));

            console.log(JSON.stringify({
              state: { ...state, playerResponse: state.playerResponse ? '[captured]' : null },
              cookieCount: cookies.length,
              responseCount: responses.length,
              directFormatCount: formats.length,
            }, null, 2));
            await context.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          xvfb-run -a node second-horn-work/browser-session.cjs

      - name: Download the source with session cookies or captured signed URL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.youtube.com/watch?v=xjItqTkLaU4'
          success=0

          if yt-dlp \
            --cookies second-horn-work/cookies.txt \
            --impersonate 'Chrome-136:Macos-15' \
            --js-runtimes node \
            --extractor-args 'youtube:player_client=web_safari,web_creator,android_vr,tv' \
            --no-playlist \
            --format 'bestvideo[height<=1080]+bestaudio/best[height<=1080]' \
            --merge-output-format mkv \
            --download-sections '*0-00:01:20' \
            --force-keyframes-at-cuts \
            --write-info-json \
            --output 'second-horn-work/source.%(ext)s' \
            "$URL"; then
            success=1
          fi

          if [[ "$success" != 1 ]]; then
            python <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          root = Path('second-horn-work')
          formats = json.loads((root / 'player-formats.json').read_text())
          responses = json.loads((root / 'media-responses.json').read_text())
          candidates = []
          for item in formats:
              candidates.append({**item, 'source': 'player'})
          for item in responses:
              query = parse_qs(urlparse(item['cleanUrl']).query)
              mime = (query.get('mime') or [item.get('contentType', '')])[0]
              itag = int((query.get('itag') or ['0'])[0] or 0)
              bitrate = int((query.get('bitrate') or ['0'])[0] or 0)
              candidates.append({
                  'url': item['cleanUrl'],
                  'mimeType': mime,
                  'itag': itag,
                  'bitrate': bitrate,
                  'source': 'network',
              })

          unique = []
          seen = set()
          for item in candidates:
              raw = item.get('url')
              if not raw or raw in seen:
                  continue
              seen.add(raw)
              unique.append(item)

          def height(item):
              try:
                  return int(item.get('height') or 0)
              except Exception:
                  match = re.search(r'(\d{3,4})', str(item.get('qualityLabel') or ''))
                  return int(match.group(1)) if match else 0

          def video_score(item):
              mime = str(item.get('mimeType') or '').lower()
              h = height(item)
              return ('mp4' in mime or 'avc1' in mime, h <= 1080, min(h, 1080), int(item.get('bitrate') or 0))

          def audio_score(item):
              mime = str(item.get('mimeType') or '').lower()
              return ('mp4' in mime or 'mp4a' in mime or 'aac' in mime, int(item.get('bitrate') or 0))

          combined = [item for item in unique if str(item.get('mimeType') or '').startswith('video/') and item.get('audioQuality')]
          videos = [item for item in unique if str(item.get('mimeType') or '').startswith('video/')]
          audios = [item for item in unique if str(item.get('mimeType') or '').startswith('audio/')]

          if combined:
              selected = max(combined, key=video_score)
              (root / 'combined-url.txt').write_text(selected['url'])
              result = {'mode': 'combined', 'combined': {k:v for k,v in selected.items() if k != 'url'}}
          elif videos and audios:
              video = max(videos, key=video_score)
              audio = max(audios, key=audio_score)
              (root / 'video-url.txt').write_text(video['url'])
              (root / 'audio-url.txt').write_text(audio['url'])
              result = {
                  'mode': 'adaptive',
                  'video': {k:v for k,v in video.items() if k != 'url'},
                  'audio': {k:v for k,v in audio.items() if k != 'url'},
              }
          else:
              raise SystemExit(f'No usable captured media URLs: combined={len(combined)} videos={len(videos)} audios={len(audios)}')
          (root / 'captured-selection.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY

            UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36'
            if [[ -f second-horn-work/combined-url.txt ]]; then
              curl --fail --location --retry 5 --retry-all-errors --max-time 900 \
                -A "$UA" -e 'https://www.youtube.com/' \
                "$(cat second-horn-work/combined-url.txt)" -o second-horn-work/source.bin
              ffmpeg -y -i second-horn-work/source.bin -t 80 -c copy second-horn-work/source.mkv
            else
              curl --fail --location --retry 5 --retry-all-errors --max-time 900 \
                -A "$UA" -e 'https://www.youtube.com/' \
                "$(cat second-horn-work/video-url.txt)" -o second-horn-work/video.bin
              curl --fail --location --retry 5 --retry-all-errors --max-time 900 \
                -A "$UA" -e 'https://www.youtube.com/' \
                "$(cat second-horn-work/audio-url.txt)" -o second-horn-work/audio.bin
              ffmpeg -y -i second-horn-work/video.bin -i second-horn-work/audio.bin \
                -t 80 -map 0:v:0 -map 1:a:0 -c copy -shortest second-horn-work/source.mkv
            fi
          fi

          SOURCE="$(find second-horn-work -maxdepth 1 -type f \( -name 'source.mkv' -o -name 'source.mp4' -o -name 'source.webm' \) | head -n 1)"
          test -n "$SOURCE"
          cp "$SOURCE" second-horn-work/resolved-source.mkv
          ffprobe -v error -print_format json -show_streams -show_format second-horn-work/resolved-source.mkv > second-horn-work/source-probe.json

      - name: Locate the exact Took-line cutoff and render synchronized assets
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i second-horn-work/resolved-source.mkv -vn -ac 1 -ar 16000 -c:a pcm_s16le second-horn-work/source.wav

          python <<'PY'
          import json
          import re
          from pathlib import Path
          from faster_whisper import WhisperModel

          root = Path('second-horn-work')
          model = WhisperModel('base.en', device='cpu', compute_type='int8')
          segments, info = model.transcribe(str(root / 'source.wav'), beam_size=5, vad_filter=True, word_timestamps=True)
          rows = []
          words = []
          for segment in segments:
              rows.append({'start': round(segment.start, 3), 'end': round(segment.end, 3), 'text': segment.text.strip()})
              for word in segment.words or []:
                  words.append({'start': round(word.start, 3), 'end': round(word.end, 3), 'word': word.word.strip()})

          normalized_words = [re.sub(r'[^a-z]', '', item['word'].lower()) for item in words]
          cutoff = None
          match_window = None
          for index, token in enumerate(normalized_words):
              if token != 'took':
                  continue
              preceding = normalized_words[max(0, index - 12):index]
              if 'beer' in preceding and 'mug' in preceding:
                  cutoff = words[index]['end'] + 0.35
                  match_window = words[max(0, index - 12):index + 1]
                  break
          if cutoff is None:
              for index, token in enumerate(normalized_words):
                  if token == 'took':
                      cutoff = words[index]['end'] + 0.35
                      match_window = words[max(0, index - 12):index + 1]
                      break
          if cutoff is None:
              raise SystemExit('Could not locate target Took line in the first 80 seconds')

          manifest = {
              'source': 'https://www.youtube.com/watch?v=xjItqTkLaU4',
              'cutoffSeconds': round(cutoff, 3),
              'targetMatch': match_window,
              'language': info.language,
              'languageProbability': info.language_probability,
              'segments': rows,
          }
          (root / 'transcript.json').write_text(json.dumps(rows, indent=2), encoding='utf-8')
          (root / 'words.json').write_text(json.dumps(words, indent=2), encoding='utf-8')
          (root / 'cut.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          (root / 'cutoff.txt').write_text(f'{cutoff:.3f}')
          print(json.dumps(manifest, indent=2))
          PY

          CUTOFF="$(cat second-horn-work/cutoff.txt)"
          FILTER='[0:v]split=2[bg][fg];[bg]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,boxblur=24:12,eq=brightness=-0.18:saturation=0.82[bg2];[fg]scale=1280:720:force_original_aspect_ratio=decrease[fg2];[bg2][fg2]overlay=(W-w)/2:(H-h)/2,format=yuv420p[v]'
          ffmpeg -y -i second-horn-work/resolved-source.mkv -t "$CUTOFF" \
            -filter_complex "$FILTER" -map '[v]' -map '0:a:0' \
            -r 30 -c:v libx264 -profile:v high -level:v 4.1 -preset medium -crf 20 \
            -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -af 'loudnorm=I=-16:TP=-1.5:LRA=11' -movflags +faststart -shortest \
            published/second-horn/hobbit-drinking-song.mp4
          ffmpeg -y -ss 1 -i published/second-horn/hobbit-drinking-song.mp4 \
            -frames:v 1 -c:v libwebp -quality 88 published/second-horn/hobbit-drinking-song-poster.webp

          ffmpeg -v error -i published/second-horn/hobbit-drinking-song.mp4 -f null -
          ffprobe -v error -print_format json -show_streams -show_format \
            published/second-horn/hobbit-drinking-song.mp4 > second-horn-work/final-probe.json

          python <<'PY'
          import hashlib
          import json
          from pathlib import Path

          out = Path('published/second-horn')
          work = Path('second-horn-work')
          probe = json.loads((work / 'final-probe.json').read_text())
          cut = json.loads((work / 'cut.json').read_text())
          video = out / 'hobbit-drinking-song.mp4'
          poster = out / 'hobbit-drinking-song-poster.webp'
          manifest = {
              'source': cut['source'],
              'cutoffSeconds': cut['cutoffSeconds'],
              'cutRule': 'End after the Took line, before the later Green Dragon verse.',
              'video': {
                  'bytes': video.stat().st_size,
                  'sha256': hashlib.sha256(video.read_bytes()).hexdigest(),
              },
              'poster': {
                  'bytes': poster.stat().st_size,
                  'sha256': hashlib.sha256(poster.read_bytes()).hexdigest(),
              },
              'probe': probe,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Build acceptance page and run Android replay smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > published/second-horn/index.html <<'HTML'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <title>Ein Lied aus dem Auenland · Horn Preview</title>
            <style>
              *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1210;color:#fff;font-family:Georgia,serif}body{min-height:100dvh;background:radial-gradient(circle at 50% 20%,#596849 0,#24362f 43%,#090d0c 82%);display:grid;place-items:center;padding:24px}.launch{width:82px;height:82px;border-radius:999px;border:1px solid #c58a45;background:#f2d39c;font-size:36px;box-shadow:0 18px 52px #0008;cursor:pointer}.label{margin-top:14px;text-align:center;font:700 12px/1.2 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#f1d7a1}.overlay{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 25%,#52604b 0,#233631 43%,#070b0a 82%);display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}.overlay.open{display:flex}.card{position:relative;width:min(95vw,760px);border:1px solid #b9954d99;border-radius:32px;background:linear-gradient(155deg,#526048e8,#28261ce8);padding:28px 30px 24px;text-align:center;box-shadow:0 30px 90px #000c}.close{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;border:1px solid #ecd9a499;background:#f7edda;color:#4b2b18;font-size:25px;z-index:3}.eyebrow{margin:0;padding:0 48px;font:800 10px/1.25 Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#f5ca72}h1{margin:8px 0 0;font-size:clamp(28px,5vw,42px);line-height:1.02;color:#fff8d9}.subtitle{margin:8px 0 0;font-size:15px;font-style:italic;color:#f7e8bddf}.frame{position:relative;margin-top:18px;aspect-ratio:16/9;border-radius:21px;overflow:hidden;border:1px solid #d3a85c;background:#000;box-shadow:0 15px 55px #0008}.frame video{display:block;width:100%;height:100%;object-fit:contain;background:#000}.caption{margin:14px auto 0;max-width:640px;font-size:16px;line-height:1.45;color:#fff4cfeb}.retry{display:none;position:absolute;left:20px;right:20px;bottom:18px;border:1px solid #d6a967;border-radius:999px;background:#120b08e8;color:#fff1cc;padding:13px;font:700 14px/1.1 Georgia,serif;letter-spacing:.14em;text-transform:uppercase}.retry.show{display:block}@media(max-width:600px){.card{padding:25px 14px 19px;border-radius:26px}.close{right:7px;top:7px;width:38px;height:38px}.eyebrow{font-size:9px;padding:0 40px}.subtitle{font-size:13px}.frame{margin-top:15px;border-radius:16px}.caption{font-size:14px}}
            </style>
          </head>
          <body>
            <main><button class="launch" id="launch" aria-label="Horn-Cinematic starten">📯</button><div class="label">Horn erklingen lassen</div></main>
            <section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Ein Lied aus dem Auenland">
              <div class="card"><button class="close" id="close" aria-label="Schließen">×</button><p class="eyebrow">Ein Trinklied aus dem Auenland</p><h1>Der Krug ist nicht leer</h1><p class="subtitle">Zwei Hobbits stimmen ein ausgelassenes Lied an.</p><div class="frame"><video id="video" playsinline preload="metadata" poster="hobbit-drinking-song-poster.webp"></video><button class="retry" id="retry">Film mit Ton starten</button></div><p class="caption">Zwischen Gelächter, Tanz und vollen Krügen wird selbst ein alter Familienname zum Reim.</p></div>
            </section>
            <script>
              const launch=document.querySelector('#launch'),overlay=document.querySelector('#overlay'),close=document.querySelector('#close'),video=document.querySelector('#video'),retry=document.querySelector('#retry');let run=0,timer=0;
              async function play(){retry.classList.remove('show');video.muted=false;video.volume=.88;video.currentTime=0;try{await video.play()}catch{retry.classList.add('show')}clearTimeout(timer);timer=setTimeout(()=>{if(video.paused||video.currentTime<.2)retry.classList.add('show')},1200)}
              async function start(){run++;overlay.classList.add('open');video.pause();video.removeAttribute('src');video.load();video.src='hobbit-drinking-song.mp4?run='+run;await play()}
              function stop(){clearTimeout(timer);video.pause();video.currentTime=0;overlay.classList.remove('open');retry.classList.remove('show')}
              launch.addEventListener('click',start);retry.addEventListener('click',play);close.addEventListener('click',stop);overlay.addEventListener('click',event=>{if(event.target===overlay)stop()});video.addEventListener('playing',()=>retry.classList.remove('show'));video.addEventListener('error',()=>retry.classList.add('show'));
            </script>
          </body>
          </html>
          HTML

          python3 -m http.server 4173 --directory published/second-horn >/tmp/second-horn-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          async function check(page,label,previousSrc=null){
            await page.click('#launch');
            await page.waitForFunction(()=>{const v=document.querySelector('#video');return v&&!v.paused&&!v.muted&&v.currentTime>.45&&v.readyState>=3},{timeout:15000});
            const start=await page.evaluate(()=>{const v=document.querySelector('#video');return{src:v.currentSrc,time:v.currentTime,width:v.videoWidth,height:v.videoHeight,error:v.error?.code??null,audios:document.querySelectorAll('audio').length}});
            if(start.width!==1280||start.height!==720||start.error!==null||start.audios!==0)throw new Error(`${label}: ${JSON.stringify(start)}`);
            if(previousSrc&&start.src===previousSrc)throw new Error(`${label}: source did not remount`);
            await page.waitForTimeout(1300);const end=await page.evaluate(()=>document.querySelector('#video').currentTime);if(end<start.time+.8)throw new Error(`${label}: timeline stalled`);console.log(`${label}: ${start.time.toFixed(3)} -> ${end.toFixed(3)}`);return start.src;
          }
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:412,height:915},userAgent:'Mozilla/5.0 (Linux; Android 16; Pixel 9) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36',isMobile:true,hasTouch:true});const page=await context.newPage();await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});const first=await check(page,'first start');await page.click('#close');await page.waitForTimeout(250);await check(page,'second start',first);await browser.close()})().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Commit the validated preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published/second-horn
          git commit -m 'assets: publish validated second Horn preview'
          git push origin HEAD:tmp/second-horn-preview-build

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-horn-preview-diagnostics
          path: |
            second-horn-work/browser-state.json
            second-horn-work/watch-page.png
            second-horn-work/media-responses.json
            second-horn-work/player-formats.json
            second-horn-work/source-probe.json
            second-horn-work/transcript.json
            second-horn-work/cut.json
            second-horn-work/final-probe.json
          if-no-files-found: warn
          retention-days: 3
